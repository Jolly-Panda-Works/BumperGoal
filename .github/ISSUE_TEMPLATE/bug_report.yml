name: Bug report
description: Report a reproducible problem
body:
  - type: input
    attributes:
      label: Version and platform
      placeholder: Android APK, installed PWA, or browser and OS
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
