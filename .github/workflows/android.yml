name: Android builds

on:
  push:
    branches: [main, Iranian-store]
    paths-ignore: ['**.md', 'docs/**', LICENSE]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    if: github.ref_name == 'main' || github.ref_name == 'Iranian-store'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        edition: ${{ fromJSON(github.ref_name == 'main' && '["debug","release"]' || '["bazaar","myket"]') }}
    env:
      EDITION: ${{ matrix.edition }}
      BUMPER_VERSION: 1.0.${{ github.run_number }}
      BUMPER_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Build web client
        env:
          VITE_NAKAMA_HOST: ${{ vars.VITE_NAKAMA_HOST }}
          VITE_NAKAMA_PORT: ${{ vars.VITE_NAKAMA_PORT }}
          VITE_NAKAMA_SSL: ${{ vars.VITE_NAKAMA_SSL }}
          VITE_NAKAMA_SERVER_KEY: ${{ vars.VITE_NAKAMA_SERVER_KEY }}
          VITE_COMMS_URL: ${{ vars.VITE_COMMS_URL }}
        run: pnpm --filter @flickkick/web build
      - name: Prepare native project
        working-directory: apps/mobile
        run: |
          pnpm exec cap add android
          pnpm android:sync
      - name: Build and verify packages
        working-directory: apps/mobile/android
        env:
          KEYSTORE_BASE64: ${{ matrix.edition != 'debug' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ../build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bumper-goal-${{ matrix.edition }}-${{ github.run_number }}
          path: out/
          if-no-files-found: error

  publish:
    name: Publish main Android release
    if: github.ref == 'refs/heads/main'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bumper-goal-*-${{ github.run_number }}
          path: out
          merge-multiple: true
      - name: Publish verified APKs and bundle
        run: |
          version="1.0.$GITHUB_RUN_NUMBER"
          tag="v$version"
          if [[ ! -f "out/BumperGoal-$version-release.apk" ]]; then
            echo "::notice::Configure Android signing secrets to publish a GitHub Release."
            exit 0
          fi
          (cd out && sha256sum *.apk *.aab > SHA256SUMS.txt)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$GITHUB_SHA"
            gh release upload "$tag" out/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Bumper Goal $tag" --generate-notes
          fi
