# FlickKick CI. Requires a GitLab Runner with the Docker executor.
stages:
  - verify
  - determinism

variables:
  PNPM_HOME: /pnpm

.node:
  image: node:22.22-bookworm
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.28.0 --activate
    - pnpm install --frozen-lockfile
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]

lint_typecheck:
  extends: .node
  stage: verify
  script:
    - pnpm lint
    - pnpm format:check
    - pnpm art:check
    - pnpm typecheck

test:
  extends: .node
  stage: verify
  script:
    - pnpm test

build:
  extends: .node
  stage: verify
  script:
    - pnpm build
  artifacts:
    paths: [apps/web/dist]
    expire_in: 1 week

# The Nakama plugin runs the same Rapier wasm in wazero; it must reproduce the
# JS vectors (packages/sim/test/vectors.json) bit for bit.
go_sim_vectors:
  stage: determinism
  image:
    name: heroiclabs/nakama-pluginbuilder:3.41.0
    entrypoint: ['']
  script:
    - cd server/nakama
    - go vet ./...
    - go test -short ./...
