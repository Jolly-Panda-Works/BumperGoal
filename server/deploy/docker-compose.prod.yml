# FlickKick production stack for one Linux host (Docker Engine + Compose v2).
#   ./server/deploy/gen-secrets.sh      (creates server/deploy/.env.prod)
#   docker compose -f server/deploy/docker-compose.prod.yml --env-file server/deploy/.env.prod up -d --build
# Only ports 80/443 are public. See docs/DEPLOYMENT.md.
name: flickkick-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'nakama', '-d', 'nakama']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    shm_size: 256m
    deploy:
      resources:
        limits: { cpus: '2', memory: 1g }
    logging: *logging

  nakama:
    build:
      context: ../..
      dockerfile: server/nakama/Dockerfile
    image: flickkick/nakama:${RELEASE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /nakama/nakama migrate up --database.address "$${DB_USER}:$${POSTGRES_PASSWORD}@$${DB_HOST}:$${DB_PORT}/$${DB_NAME}"
        exec /nakama/nakama --config /nakama/data/flickkick.yml \
          --database.address "$${DB_USER}:$${POSTGRES_PASSWORD}@$${DB_HOST}:$${DB_PORT}/$${DB_NAME}" \
          --socket.server_key "$${NAKAMA_SERVER_KEY}" \
          --session.encryption_key "$${NAKAMA_SESSION_KEY}" \
          --session.refresh_encryption_key "$${NAKAMA_REFRESH_KEY}" \
          --runtime.http_key "$${NAKAMA_HTTP_KEY}" \
          --console.username admin \
          --console.password "$${NAKAMA_CONSOLE_PASSWORD}" \
          --console.signing_key "$${NAKAMA_CONSOLE_SIGNING_KEY}" \
          --runtime.env "MM_BOT_TIMEOUT_MS=$${MM_BOT_TIMEOUT_MS}" \
          --runtime.env "AI_SERVER_MAX_SIMULATIONS=$${AI_SERVER_MAX_SIMULATIONS}" \
          --runtime.env "ADMIN_USERNAME=$${ADMIN_USERNAME}" \
          --runtime.env "ADMIN_PASSWORD=$${ADMIN_PASSWORD}" \
          --runtime.env "COMMS_URL=$${COMMS_URL}" \
          --runtime.env "COMMS_SERVER_KEY=$${COMMS_SERVER_KEY}" \
          --runtime.env "COMMS_WEBHOOK_SECRET=$${COMMS_WEBHOOK_SECRET}"
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-nakama}
      DB_USER: ${DB_USER:-nakama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      NAKAMA_SERVER_KEY: ${NAKAMA_SERVER_KEY:?set NAKAMA_SERVER_KEY}
      NAKAMA_SESSION_KEY: ${NAKAMA_SESSION_KEY:?set NAKAMA_SESSION_KEY}
      NAKAMA_REFRESH_KEY: ${NAKAMA_REFRESH_KEY:?set NAKAMA_REFRESH_KEY}
      NAKAMA_HTTP_KEY: ${NAKAMA_HTTP_KEY:?set NAKAMA_HTTP_KEY}
      NAKAMA_CONSOLE_PASSWORD: ${NAKAMA_CONSOLE_PASSWORD:?set NAKAMA_CONSOLE_PASSWORD}
      NAKAMA_CONSOLE_SIGNING_KEY: ${NAKAMA_CONSOLE_SIGNING_KEY:?set NAKAMA_CONSOLE_SIGNING_KEY}
      MM_BOT_TIMEOUT_MS: ${MM_BOT_TIMEOUT_MS:-10000}
      AI_SERVER_MAX_SIMULATIONS: ${AI_SERVER_MAX_SIMULATIONS:-12}
      # Balance panel at /admin; empty disables it (see docs/DEPLOYMENT.md).
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Voice chat through comms game rooms; empty disables it (see docs/VOICE_CHAT.md).
      COMMS_URL: ${COMMS_URL:-}
      COMMS_SERVER_KEY: ${COMMS_SERVER_KEY:-}
      COMMS_WEBHOOK_SECRET: ${COMMS_WEBHOOK_SECRET:-}
    # No public ports: clients reach Nakama through the web container (HTTPS/WSS).
    # The admin console is only on the host's loopback (use an SSH tunnel).
    ports:
      - '127.0.0.1:7351:7351'
    healthcheck:
      test: ['CMD', '/nakama/nakama', 'healthcheck']
      interval: 10s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: '${NAKAMA_CPUS:-2}', memory: 2g }
    logging: *logging

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        VITE_NAKAMA_HOST: ${API_DOMAIN:?set API_DOMAIN}
        VITE_NAKAMA_PORT: '443'
        VITE_NAKAMA_SSL: 'true'
        VITE_NAKAMA_SERVER_KEY: ${NAKAMA_SERVER_KEY:?set NAKAMA_SERVER_KEY}
        VITE_COMMS_URL: ${COMMS_PUBLIC_URL:-}
    image: flickkick/web:${RELEASE_TAG:-latest}
    depends_on:
      nakama:
        condition: service_healthy
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?set WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      # Origins the page may connect to for voice: comms and its LiveKit media server.
      VOICE_CONNECT_SRC: ${VOICE_CONNECT_SRC:-}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data # certificates: keep across restarts (Let's Encrypt rate limits)
      - caddy_config:/config
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:2019/config/']
      interval: 15s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: '1', memory: 256m }
    logging: *logging

  backup:
    image: postgres:16.10-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-nakama}
      DB_USER: ${DB_USER:-nakama}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint:
      - /bin/sh
      - -ec
      - |
        while true; do
          file="/backups/nakama-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          pg_dump -h "$$DB_HOST" -p "$$DB_PORT" -U "$$DB_USER" -d "$$DB_NAME" -Fc -f "$$file.partial" && mv "$$file.partial" "$$file"
          echo "backup written: $$file ($$(du -h "$$file" | cut -f1))"
          find /backups -name 'nakama-*.dump' -mtime +"$$BACKUP_RETENTION_DAYS" -delete
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256m }
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
